[project]
name = "video-rag"
version = "0.1.0"
description = "Video-segment retrieval: WhisperX transcription, Qwen2.5-3B summaries, BGE-M3 embeddings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vivek Kumar Verma", email = "Vivek.verma1018@gmail.com" }]
keywords = ["rag", "whisperx", "bge-m3", "qwen", "video-retrieval", "semantic-search"]
dependencies = [
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
transcribe = ["whisperx", "mutagen", "torch"]
embed = ["FlagEmbedding", "torch"]
summarize-hf = ["transformers>=4.40", "torch"]
all = [
    "whisperx",
    "mutagen",
    "FlagEmbedding",
    "transformers>=4.40",
    "torch",
]

[project.scripts]
video-rag = "video_rag.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
